<div class="row mt-5">
  <div class="col-md-6 offset-md-3 col-xs-12">
    <div class="card">
      <div class="card-header">{{ isLogin ? "Login" : "Register"}}</div>
      <div class="card-body">
        <div class="mb-3">
          <label for="" class="form-label">Email</label>
          <input type="text" name="" id="" class="form-control" [(ngModel)]="email">
        </div>
        <div class="mb-3">
          <label for="" class="form-label">Password</label>
          <input type="password" name="" id="" class="form-control" [(ngModel)]="password">
        </div>
        <div class="mb-3">
          <button class="btn btn-primary" (click)="onLogin()">{{ isLogin ? "Login" : "Create New User"}}</button>
          <button class="btn btn-primary float-end" (click)="isLogin = !isLogin">
            {{ isLogin ? "Don't have an account? Create one!" : "Already have an account? Login instead!"}}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
