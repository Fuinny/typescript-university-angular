<div class="card shadow-sm">
  <div class="card-header bg-primary text-white text-center">
    <h3 class="mb-0">BMI Calculator</h3>
  </div>
  <div class="card-body p-4">
    <form (ngSubmit)="calculateBMI()">
      <div class="mb-3">
        <label for="height" class="form-label font-weight-bold">Height (cm)</label>
        <input type="number" id="height" class="form-control" [(ngModel)]="height" name="height" placeholder="e.g. 175"
          required />
      </div>
      <div class="mb-3">
        <label for="weight" class="form-label font-weight-bold">Weight (kg)</label>
        <input type="number" id="weight" class="form-control" [(ngModel)]="weight" name="weight" placeholder="e.g. 70"
          required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Calculate BMI</button>
    </form>
    @if (bmi != null) {
    <div class="mt-4 p-3 border rounded text-center bg-light">
      <p class="text-muted mb-1">Your Calculated BMI</p>
      <h2 class="display-5 fw-bold text-dark mb-2">{{ bmi }}</h2>
      <span class="badge fs-6 p-2" [ngClass]="getBadgeClass()">{{ weightCategory }}</span>
    </div>
    }
  </div>
</div>
