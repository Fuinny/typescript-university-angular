<div class="card mt-3">
  <div class="card-header">Add new note</div>
  <div class="card-body">
    @if (isLoading()) {
    <div class="alert alert-info mb-3">Loading...</div>
    } @else if (isError()) {
    <div class="alert alert-danger mb-3">Error!</div>
    } @else {
    <div class="mb-3">
      <label for="" class="form-label">Title</label>
      <input type="text" name="" id="" class="form-control" [(ngModel)]="noteTitle">
      <label for="" class="form-label">Content</label>
      <input type="text" name="" id="" class="form-control" [(ngModel)]="noteContent">
    </div>
    <button class="btn btn-primary" (click)="addNote()">Add Note</button>
    }
  </div>
</div>
