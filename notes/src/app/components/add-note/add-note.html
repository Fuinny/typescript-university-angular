<div class="card mt-3">
  <div class="card-header">Add new note</div>
  <div class="card-body">
    <div class="mb-3">
      <label>Title</label>
      <input type="text" name="" id="" class="form-control" [(ngModel)]="noteTitle">
      <label>Content</label>
      <input type="text" name="" id="" class="form-control" [(ngModel)]="noteContent">
    </div>
    <button class="btn btn-primary" (click)="addNote()">Add new note</button>
  </div>
</div>
