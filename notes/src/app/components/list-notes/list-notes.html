<div class="card mt-3">
  <div class="card-header">Saved notes</div>
  <div class="card-body">
    <div *ngFor="let note of noteList();">
      <div class="alert alert-info d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ note.title }}</strong>
          <p class="mb-0">{{ note.content }}</p>
        </div>
        <button class="btn btn-danger btn-sm ms-3" (click)="deleteNoteAt(note.id)">Delete</button>
      </div>
    </div>
  </div>
</div>
