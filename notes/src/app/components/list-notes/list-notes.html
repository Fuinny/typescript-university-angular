<div class="card mt-3">
  <div class="card-header">Saved notes</div>
  <div class="card-body">
    @if (isLoading()) {
    <div class="alert alert-info mb-3">Loading...</div>
    } @else if (isError()) {
    <div class="alert alert-danger mb-3">Error!</div>
    } @else {
    @for (note of noteList(); track note.id) {
    <div class="mb-3">
      <div class="alert alert-info d-flex justify-content-between align-items-start mb-0">
        <div>
          <strong>{{ note.title }}</strong>
          <p class="mb-0">{{ note.content }}</p>
        </div>
        <div class="d-flex gap-2 ms-3">
          <a class="btn btn-success btn-sm" [routerLink]="['edit', note.id]">Edit</a>
          <button class="btn btn-danger btn-sm" (click)="deleteNoteAt(note.id)">Delete</button>
        </div>
      </div>
    </div>
    } @empty {
    <div class="alert alert-secondary">No notes yet.</div>
    }
    }
  </div>
</div>
